spring.application.name=backend-test

# Base de datos en memoria para pruebas automáticas
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Deshabilitar envío de correos real en tests
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test@test.com
spring.mail.password=test

jwt.secret=TestSecretKeyParaFirmarTokensEnPruebasUnitariasEIntegracion2026!
jwt.expiration=3600000
